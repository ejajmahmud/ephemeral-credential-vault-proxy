[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-credential-vault-proxy"
version = "0.1.0"
description = "Just-in-time single-use credential vending proxy that protects long-lived master API keys from agent memory leakage"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
ephemeral-credential-vault-proxy = "ephemeral_credential_vault_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ephemeral_credential_vault_proxy*"]
